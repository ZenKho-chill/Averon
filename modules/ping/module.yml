name: ping
version: 1.1.1
runtime:
  language: typescript
  engine: node
  version: ">=18"
  transport: in-process
entry: src/index.ts
config:
  schema: config/schema.yml
  defaults: config/defaults.yml
commands:
  - name: ping
    description:
      vi: "Lệnh ping"
      en: "Ping command"
    handler: commands/ping.ts
    type: chat_input   # chat_input | user | message (context menu)
    scope: [global]    # global | guild | user (mặc định global)