# JSON Schema cho config module ping
# EN: JSON Schema for module ping config
$schema: http://json-schema.org/draft-07/schema#
title: Ping module config
type: object
additionalProperties: false
properties:
  random:
    type: boolean
    default: true
  responses:
    type: array
    items:
      oneOf:
        - type: object
          required: [content]
          additionalProperties: false
          properties:
            content: { type: string }
        - type: object
          required: [embed]
          additionalProperties: false
          properties:
            embed:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                # Màu hex: "#RRGGBB" hoặc "RRGGBB" (6 hoặc 8 chữ số, hỗ trợ alpha). Vẫn chấp nhận số decimal.
                color:
                  type: [integer, string]
                  pattern: ^#?[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$
                timestamp: { type: [boolean, string] }
                url: { type: string }
                image: { type: string }
                thumbnail: { type: string }
                author: { type: object }
                footer: { type: object }
                fields:
                  type: array
                  items:
                    type: object
                    required: [name, value]
                    properties:
                      name: { type: string }
                      value: { type: string }
                      inline: { type: boolean }
