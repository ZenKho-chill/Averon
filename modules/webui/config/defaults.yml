# Config mặc định cho module webui — chỉnh trực tiếp file này rồi reload module để áp dụng.
# EN: Default config for module webui — edit this file then reload the module to apply.
#
# host: địa chỉ bind. 127.0.0.1 = local-only (mặc định, an toàn nhất). 0.0.0.0 = truy cập từ xa
# — KHI ĐÓ BẮT BUỘC cấu hình auth (api_token hoặc Discord OAuth2), nếu không web sẽ không phục vụ.
# EN: bind host. 127.0.0.1 = local-only (default, safest). 0.0.0.0 = reachable remotely —
# THEN auth (api_token or Discord OAuth2) is REQUIRED, otherwise the web server won't serve.
host: "127.0.0.1"
# port: cổng HTTP. Đổi cổng → sửa ở đây rồi reload module webui.
# EN: HTTP port. Change here then reload the webui module.
port: 3000
# static_dir: thư mục frontend (tương đối folder module). Mặc định public/.
# EN: frontend directory (relative to the module folder). Default public/.
static_dir: "public"
# public_home: bật trang chủ công khai (không cần login — giới thiệu bot + status cơ bản).
# Tắt → homepage yêu cầu đăng nhập.
# EN: enable the public homepage (no login — bot intro + basic status). Off → homepage requires login.
public_home: true
# invite_url: link invite bot (Discord OAuth2) — hiển thị nút "Add to Discord" trên trang chủ.
# EN: bot invite link (Discord OAuth2) — powers the "Add to Discord" homepage CTA.
# invite_url: "https://discord.com/oauth2/authorize?client_id=YOUR_CLIENT_ID&scope=bot&permissions=0"
# admin_user_ids: danh sách Discord user ID được xem là admin khi đăng nhập qua Discord OAuth2.
# EN: Discord user IDs treated as admins when logging in via Discord OAuth2.
admin_user_ids: []
# oauth2: Discord OAuth2 cho user dashboard. client_id + redirect_uri KHÔNG phải secret.
# client_secret là secret — đặt trong config/config.yml (mục webui.oauth2.client_secret, file
# đã gitignored), KHÔNG đặt trong file này (file tracked, repo PUBLIC).
# EN: Discord OAuth2 for the user dashboard. client_id + redirect_uri are NOT secrets.
# client_secret is a secret — put it in config/config.yml (webui.oauth2.client_secret, gitignored),
# never here (this file is tracked in a PUBLIC repo).
oauth2:
  client_id: ""
  redirect_uri: ""